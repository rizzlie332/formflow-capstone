<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormFlow</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f4f7fb;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.container{

background:white;

padding:50px;

border-radius:12px;

box-shadow:0 0 20px rgba(0,0,0,.1);

text-align:center;

width:500px;

}

h1{

font-size:42px;

color:#0077cc;

margin-bottom:15px;

}

p{

font-size:18px;

margin-bottom:25px;

color:#555;

}

button{

padding:14px 28px;

background:#0077cc;

border:none;

border-radius:6px;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#005fa3;

}

.features{

margin-top:35px;

text-align:left;

}

.features li{

margin:10px 0;

}

</style>

</head>

<body>

<div class="container">

<h1>FormFlow</h1>

<p>Dockerized 3-Tier Application</p>

<button>Get Started</button>

<div class="features">

<h3>Project Features</h3>

<ul>

<li>Frontend Container</li>

<li>Backend API</li>

<li>Database Container</li>

<li>Docker Compose</li>

<li>GitHub Actions CI/CD</li>

<li>Linux VM Deployment</li>

</ul>

</div>

</div>

</body>
</html>
